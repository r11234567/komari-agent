name: Release / Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: write
  actions: read

jobs:
  signing-preflight:
    if: ${{ !github.event.release.prerelease || contains(github.event.release.tag_name, '-dev.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.targets.outputs.individual }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Read the supported build targets
        id: targets
        run: node scripts/ci/build-matrix.cjs >> "$GITHUB_OUTPUT"
      - name: Require successful CI for the exact release commit
        uses: actions/github-script@v9
        with:
          script: |
            const gate = require('./scripts/ci/release-gate.cjs');
            // A dev publication can arrive before the just-pushed PR checks finish.
            // Wait here without weakening the exact-commit or signing requirements.
            const attempts = context.payload.release?.prerelease ? 40 : 1;
            for (let attempt = 1; ; attempt++) {
              try { await gate({ github, context, core }); break; }
              catch (error) {
                if (attempt >= attempts || !error.retryable) throw error;
                core.info(`Waiting for exact-commit CI (${attempt}/${attempts}): ${error.message}`);
                await new Promise(resolve => setTimeout(resolve, 30000));
              }
            }
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - name: Verify the reviewed protocol pin
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          node scripts/ci/check-protocol.cjs --resolve-go 2>&1 | tee ci-artifacts/protocol-pin.log
      - name: Validate provisioned publisher key before building any target
        env:
          KOMARI_RELEASE_SIGNING_KEY: ${{ secrets.KOMARI_RELEASE_SIGNING_KEY }}
          KOMARI_RELEASE_SIGNING_KEY_ID: ${{ vars.KOMARI_RELEASE_SIGNING_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          trap 'echo "$?" > ci-artifacts/preflight-exit.txt' EXIT
          go run scripts/sign-helper-release.go --check 2>&1 | tee ci-artifacts/signing-preflight.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-signing-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30

  build-and-attach:
    needs: signing-preflight
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.signing-preflight.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version

      - name: Build Agent, rescue and Host
        env:
          GOOS: ${{ matrix.goos }}
          TARGET_ARCHES: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          trap 'echo "$?" > ci-artifacts/build-exit.txt' EXIT
          bash scripts/ci/build-targets.sh
          extension=""
          if [[ "$GOOS" == windows ]]; then extension=.exe; fi
          suffix="$GOOS-$TARGET_ARCHES$extension"
          dir="build/$GOOS-$TARGET_ARCHES"
          mv "$dir/komari-agent-$suffix" "$dir/komari-agent-rescue-$suffix" "$dir/komari-host-$suffix" .
          mv "$dir/komari-agent-$suffix.sha256" "$dir/komari-host-$suffix.sha256" .

      - name: Sign exact Agent, Host and helper release manifests
        env:
          KOMARI_RELEASE_SIGNING_KEY: ${{ secrets.KOMARI_RELEASE_SIGNING_KEY }}
          KOMARI_RELEASE_SIGNING_KEY_ID: ${{ vars.KOMARI_RELEASE_SIGNING_KEY_ID }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_OS: ${{ matrix.goos }}
          RELEASE_ARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          trap 'echo "$?" > ci-artifacts/signing-exit.txt' EXIT
          extension=""
          if [ "$RELEASE_OS" = windows ]; then extension=.exe; fi
          for component in komari-agent komari-host komari-agent-rescue; do
            binary="$component-$RELEASE_OS-$RELEASE_ARCH$extension"
            go run scripts/sign-helper-release.go "$binary" "$RELEASE_TAG" "$RELEASE_OS" "$RELEASE_ARCH" || exit $?
          done 2>&1 | tee ci-artifacts/signing.log

      - name: Retain built and signed release files
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            komari-agent-*
            komari-host-*
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-logs-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30

  publish:
    needs: build-and-attach
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          pattern: release-binaries-*
          path: release-assets
          merge-multiple: true
      - name: Publish only after every target builds and signs successfully
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          trap 'echo "$?" > ci-artifacts/publish-exit.txt' EXIT
          gh release upload "$RELEASE_TAG" release-assets/* docs/release-signing-key.json --repo "$RELEASE_REPOSITORY" --clobber 2>&1 | tee ci-artifacts/publish.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
