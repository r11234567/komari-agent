name: Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-attach:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        exclude:
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: 386
          - goos: darwin
            goarch: arm
        include:
          - goos: linux
            goarch: loong64
        goos: [windows, linux, darwin, freebsd]
        goarch: [amd64, arm64, 386, arm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          BINARY_NAME=komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          elif [ "${{ matrix.goos }}" = "darwin" ]; then
            # macOS binaries typically do not have a file extension
            true
          fi
            go build -trimpath -ldflags="-X github.com/komari-monitor/komari-agent/update.CurrentVersion=${VERSION}" -o $BINARY_NAME

          RESCUE_BINARY_NAME=komari-agent-rescue-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            RESCUE_BINARY_NAME=${RESCUE_BINARY_NAME}.exe
          fi
          go build -trimpath -ldflags="-X github.com/komari-monitor/komari-agent/update.CurrentVersion=${VERSION}" -o $RESCUE_BINARY_NAME ./cmd/komari-agent-rescue

          HOST_BINARY_NAME=komari-host-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then HOST_BINARY_NAME=${HOST_BINARY_NAME}.exe; fi
          go build -trimpath -o "$HOST_BINARY_NAME" ./cmd/komari-host
          sha256sum "$BINARY_NAME" > "$BINARY_NAME.sha256"
          sha256sum "$HOST_BINARY_NAME" > "$HOST_BINARY_NAME.sha256"

      - name: Sign exact helper release manifest
        env:
          KOMARI_RELEASE_SIGNING_KEY: ${{ secrets.KOMARI_RELEASE_SIGNING_KEY }}
          KOMARI_RELEASE_SIGNING_KEY_ID: ${{ vars.KOMARI_RELEASE_SIGNING_KEY_ID }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_OS: ${{ matrix.goos }}
          RELEASE_ARCH: ${{ matrix.goarch }}
        run: |
          helper="komari-agent-rescue-$RELEASE_OS-$RELEASE_ARCH"
          if [ "$RELEASE_OS" = windows ]; then helper="$helper.exe"; fi
          go run scripts/sign-helper-release.go "$helper" "$RELEASE_TAG" "$RELEASE_OS" "$RELEASE_ARCH"


      - name: Upload binary to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BINARY_NAME=komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          elif [ "${{ matrix.goos }}" = "darwin" ]; then
            true
          fi
          gh release upload ${{ github.event.release.tag_name }} $BINARY_NAME --repo ${{ github.repository }}
          RESCUE_BINARY_NAME=komari-agent-rescue-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            RESCUE_BINARY_NAME=${RESCUE_BINARY_NAME}.exe
          fi
          gh release upload ${{ github.event.release.tag_name }} $RESCUE_BINARY_NAME --repo ${{ github.repository }}
          gh release upload ${{ github.event.release.tag_name }} "$RESCUE_BINARY_NAME.release.json" --repo ${{ github.repository }}
          HOST_BINARY_NAME=komari-host-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then HOST_BINARY_NAME=${HOST_BINARY_NAME}.exe; fi
          gh release upload ${{ github.event.release.tag_name }} "$HOST_BINARY_NAME" "$BINARY_NAME.sha256" "$HOST_BINARY_NAME.sha256" --repo ${{ github.repository }}
        shell: bash
