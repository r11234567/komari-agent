name: Credential lifecycle Agent stage
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: credential-agent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stage-two:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 3GiB
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Race-check real credential files, signed responses, renewal owner and cancellation
        run: bash scripts/ci/run-audit-check.sh credential-agent bash scripts/ci/run-go-tests.sh -race ./core/credentials ./core/enrollment ./clientcore ./rescue
      - name: Build isolated root handoff checkpoint
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh credential-handoff-build go test -race -c -o /tmp/credential-rescue.test ./rescue
      - name: Real protected files and signed DPoP rescue handoff on disposable runner
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh credential-handoff sudo env KOMARI_CREDENTIAL_ROOT_TEST=1 /tmp/credential-rescue.test -test.v -test.run '^TestCredentialHandoff'
      - name: Reject missing skipped or failed phase assertions
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh credential-agent-evidence python3 scripts/ci/check-credential-lifecycle.py
      - name: Prove handoff test fails when file notifications are disabled
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh credential-handoff-negative bash scripts/ci/test-credential-handoff-negative.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credential-agent-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
          if-no-files-found: error
