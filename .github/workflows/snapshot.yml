name: Release / Publish Snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.grouped }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Read the supported build targets
        id: targets
        run: node scripts/ci/build-matrix.cjs >> "$GITHUB_OUTPUT"
      - name: Ensure snapshot target is main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Snapshot builds must run from refs/heads/main. Current ref: ${GITHUB_REF}"
            exit 1
          fi

          git fetch --no-tags --depth=1 origin main
          MAIN_SHA="$(git rev-parse FETCH_HEAD)"

          if [ "${GITHUB_SHA}" != "${MAIN_SHA}" ]; then
            echo "Snapshot builds must use the current main commit."
            echo "Workflow SHA: ${GITHUB_SHA}"
            echo "Current main: ${MAIN_SHA}"
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - name: Validate the pinned rescue publisher signing key
        env:
          KOMARI_RELEASE_SIGNING_KEY: ${{ secrets.KOMARI_RELEASE_SIGNING_KEY }}
          KOMARI_RELEASE_SIGNING_KEY_ID: ${{ vars.KOMARI_RELEASE_SIGNING_KEY_ID }}
        run: bash scripts/ci/run-audit-check.sh snapshot-signing-preflight go run scripts/sign-helper-release.go --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30

  prepare:
    needs: validate-ref
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Generate snapshot version
        id: version
        run: |
          VERSION="Snapshot-$(date -u +%y%m%d%H%M)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Snapshot version: ${VERSION}"

  build-and-attach-binaries:
    needs: [prepare, validate-ref]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.validate-ref.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - name: Build all architectures for this OS
        env:
          GOOS: ${{ matrix.goos }}
          TARGET_ARCHES: ${{ matrix.arches }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/ci/build-targets.sh
      - name: Sign installation artifacts for the exact Snapshot release
        env:
          RELEASE_OS: ${{ matrix.goos }}
          KOMARI_RELEASE_SIGNING_KEY: ${{ secrets.KOMARI_RELEASE_SIGNING_KEY }}
          KOMARI_RELEASE_SIGNING_KEY_ID: ${{ vars.KOMARI_RELEASE_SIGNING_KEY_ID }}
          SNAPSHOT_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_ARCHES: ${{ matrix.arches }}
        run: |-
          set -euo pipefail
          for arch in $TARGET_ARCHES; do
            components=(komari-agent)
            extension=""
            if [[ "$RELEASE_OS" == windows ]]; then extension=.exe; fi
            if [[ "$RELEASE_OS" == linux ]]; then
              components+=(komari-host komari-agent-rescue)
            fi
            for component in "${components[@]}"; do
              binary="build/$RELEASE_OS-$arch/$component-$RELEASE_OS-$arch$extension"
              bash scripts/ci/run-audit-check.sh "snapshot-sign-$component-$arch" go run scripts/sign-helper-release.go "$binary" "$SNAPSHOT_VERSION" "$RELEASE_OS" "$arch"
            done
          done
      - name: Upload amd64 binaries
        if: contains(format(' {0} ', matrix.arches), ' amd64 ')
        uses: actions/upload-artifact@v7
        with:
          name: komari-agent-${{ matrix.goos }}-amd64
          path: build/${{ matrix.goos }}-amd64/
          if-no-files-found: error
      - name: Upload arm64 binaries
        if: contains(format(' {0} ', matrix.arches), ' arm64 ')
        uses: actions/upload-artifact@v7
        with:
          name: komari-agent-${{ matrix.goos }}-arm64
          path: build/${{ matrix.goos }}-arm64/
          if-no-files-found: error
      - name: Upload 386 binaries
        if: contains(format(' {0} ', matrix.arches), ' 386 ')
        uses: actions/upload-artifact@v7
        with:
          name: komari-agent-${{ matrix.goos }}-386
          path: build/${{ matrix.goos }}-386/
          if-no-files-found: error
      - name: Upload arm binaries
        if: contains(format(' {0} ', matrix.arches), ' arm ')
        uses: actions/upload-artifact@v7
        with:
          name: komari-agent-${{ matrix.goos }}-arm
          path: build/${{ matrix.goos }}-arm/
          if-no-files-found: error
      - name: Upload loong64 binaries
        if: contains(format(' {0} ', matrix.arches), ' loong64 ')
        uses: actions/upload-artifact@v7
        with:
          name: komari-agent-${{ matrix.goos }}-loong64
          path: build/${{ matrix.goos }}-loong64/
          if-no-files-found: error
      - name: Retain snapshot-build-logs-${{ matrix.goos }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-build-logs-${{ matrix.goos }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
    timeout-minutes: 90

  publish-snapshot-release:
    needs: [prepare, build-and-attach-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Ensure commit is still current main
        run: |
          git fetch --no-tags --depth=1 origin main
          MAIN_SHA="$(git rev-parse FETCH_HEAD)"

          if [ "${GITHUB_SHA}" != "${MAIN_SHA}" ]; then
            echo "Snapshot publish skipped because a newer main commit exists."
            echo "Workflow SHA: ${GITHUB_SHA}"
            echo "Current main: ${MAIN_SHA}"
            exit 1
          fi

      - name: Set up Node for asset verification
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download all binaries
        uses: actions/download-artifact@v7
        with:
          pattern: komari-agent-*
          path: artifacts
          merge-multiple: true

      - name: Verify Linux installer assets and generate publication inventory
        env:
          SNAPSHOT_VERSION: ${{ needs.prepare.outputs.version }}
        # This inventory is the input to this workflow's release upload below.
        run: bash scripts/ci/run-audit-check.sh snapshot-prepare bash -c 'node scripts/ci/snapshot-assets.cjs artifacts "$SNAPSHOT_VERSION" > ci-artifacts/snapshot-assets.txt && cat ci-artifacts/snapshot-assets.txt'

      - name: Create snapshot prerelease and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euxo pipefail
          exec > >(tee ci-artifacts/snapshot-publish.log) 2>&1
          trap 'echo "$?" > ci-artifacts/snapshot-publish-exit.txt' EXIT
          echo "Snapshot version: ${VERSION}"
          mapfile -t release_assets < ci-artifacts/snapshot-assets.txt

          if gh release view "${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists, deleting it before recreation..."
            gh release delete "${VERSION}" --repo "${{ github.repository }}" --cleanup-tag --yes
          fi

          gh release create "${VERSION}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${VERSION}" \
            --notes "Automated snapshot build (${VERSION}) from commit ${{ github.sha }}." \
            --prerelease \
            "${release_assets[@]}"

          gh release list \
            --repo "${{ github.repository }}" \
            --limit 1000 \
            --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("Snapshot-"))) | .tagName' |
          while IFS= read -r tag; do
            if [ -z "${tag}" ] || [ "${tag}" = "${VERSION}" ]; then
              continue
            fi

            echo "Deleting old snapshot release ${tag}..."
            gh release delete "${tag}" --repo "${{ github.repository }}" --cleanup-tag --yes
          done
        shell: bash

      - name: Retain snapshot asset and checksum diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-artifacts/
            artifacts/SHA256SUMS
          retention-days: 30

  build-and-push-docker:
    needs: [prepare, publish-snapshot-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Ensure commit is still current main
        run: |
          git fetch --no-tags --depth=1 origin main
          MAIN_SHA="$(git rev-parse FETCH_HEAD)"

          if [ "${GITHUB_SHA}" != "${MAIN_SHA}" ]; then
            echo "Snapshot Docker publish skipped because a newer main commit exists."
            echo "Workflow SHA: ${GITHUB_SHA}"
            echo "Current main: ${MAIN_SHA}"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version

      - name: Build static binaries for multi-arch
        env:
          GOOS: linux
          CGO_ENABLED: 0
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          LDFLAGS="-X github.com/komari-monitor/komari-agent/update.CurrentVersion=${VERSION}"

          echo "Building for linux/amd64..."
          GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o komari-agent-linux-amd64

          echo "Building for linux/arm64..."
          GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o komari-agent-linux-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=snapshot

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          provenance: false
