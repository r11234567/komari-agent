name: Privileged delivery audit
on:
  pull_request:
  push:
    branches: [main, 'test/privileged-delivery-regressions']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Existing behavior regression tests
        run: scripts/ci/run-go-tests.sh ./cmd ./core/runtimeconfig ./core/privileged ./core/capability ./core/localauth ./clientcore ./server ./terminal ./rescue
      - name: Reproduce and track known defects with temporary fixtures
        if: success() || failure()
        run: python3 scripts/ci/run-privileged-audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: privileged-agent-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
