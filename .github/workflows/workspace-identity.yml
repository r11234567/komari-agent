name: Workspace OS identity checkpoint
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: File relay HTTPS, HTTP2, refreshed credentials, streaming and cancellation
        run: bash scripts/ci/run-audit-check.sh workspace-transfer bash scripts/ci/run-go-tests.sh -race -run 'Test(WorkerTransferRelay|WorkspaceTransferClient|TransferFailureReason)' ./files
      - name: Race regressions for identity, file workers and terminal
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh workspace-identity bash scripts/ci/run-go-tests.sh -race ./core/osidentity ./files ./terminal ./clientcore
      - name: Build isolated worker test binary
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh build-worker go test -c -o /tmp/komari-workspace-worker.test ./files
      - name: Build selected-account PTY checkpoint
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh build-terminal go test -c -o /tmp/komari-workspace-terminal.test ./terminal
      - name: Real root-to-nonroot permissions on a disposable hosted runner
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          sudo useradd --create-home --shell /bin/bash komari-workspace-ci
          chmod 755 /tmp/komari-workspace-worker.test
          bash scripts/ci/run-audit-check.sh real-uid sudo env KOMARI_IDENTITY_TEST_USER=komari-workspace-ci /tmp/komari-workspace-worker.test -test.v -test.run '^TestWorker(RealOSPermissionsAndScope|TransfersPreserveUploadStateAndOSAccount)$'
      - name: Real selected-account login profile, prompt, home and secret isolation
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          printf '%s\n' 'echo WORKSPACE_LOGIN_PROFILE_LOADED' 'PS1="\u@\h:\w\$ "' | sudo tee /home/komari-workspace-ci/.bash_profile > /dev/null
          sudo chown komari-workspace-ci:komari-workspace-ci /home/komari-workspace-ci/.bash_profile
          chmod 755 /tmp/komari-workspace-terminal.test
          bash scripts/ci/run-audit-check.sh real-pty sudo env KOMARI_TERMINAL_TEST_USER=komari-workspace-ci /tmp/komari-workspace-terminal.test -test.v -test.run '^TestSelectedAccountInteractiveLoginPTY$'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
