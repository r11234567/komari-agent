name: Build on Main

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        exclude:
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: 386
          - goos: darwin
            goarch: arm
        include:
          - goos: linux
            goarch: loong64
        goos: [windows, linux, darwin, freebsd]
        goarch: [amd64, arm64, 386, arm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify pinned protocol dependency
        run: go list -m github.com/r11234567/komari-proto | grep -Fx 'github.com/r11234567/komari-proto v0.1.4'

      - name: Run transport and runtime contract tests
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test ./core/... ./clientcore ./monitoring/unit ./terminal ./cmd

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.sha }}
        run: |
          BINARY_NAME=komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          fi
          go build -trimpath -ldflags="-X github.com/komari-monitor/komari-agent/update.CurrentVersion=${VERSION}" -o $BINARY_NAME

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}*

  capability-fixtures:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            fixture: linux-non-root
          - os: windows-latest
            fixture: windows-standard-user
          - os: windows-latest
            fixture: windows-administrator
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build capability packages
        run: go test ./core/capability -run TestPrivilegeFixturesDeclareLimitedCapabilities && go test ./core/runtimeconfig ./clientcore
      - name: Validate recovery entrypoint
        shell: bash
        run: |
          go build -o komari-agent${{ runner.os == 'Windows' && '.exe' || '' }} .
          ./komari-agent${{ runner.os == 'Windows' && '.exe' || '' }} recover diagnostics
