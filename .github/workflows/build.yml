name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol-and-release-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - name: Verify protocol pin and release gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          exec > >(tee ci-artifacts/protocol-and-release-policy.log) 2>&1
          trap 'echo "$?" > ci-artifacts/policy-exit.txt' EXIT
          node --test scripts/ci/release-policy.test.cjs scripts/ci/protocol-submodule.test.cjs
          node scripts/ci/check-protocol.cjs --resolve-go
      - name: Exercise release discovery with the actual Actions token and SDK
        uses: actions/github-script@v9
        with:
          script: |
            const { discoverRuns, REQUIRED } = require('./scripts/ci/release-gate.cjs');
            // PRs may be stacked on an audit branch. Discovery is a main-run SDK
            // contract check; release acceptance still uses the exact release SHA.
            const sha = context.eventName === "pull_request"
              ? (await github.rest.repos.getBranch({ ...context.repo, branch: "main" })).data.commit.sha
              : context.sha;
            const observations = [];
            try {
              for (const workflow of REQUIRED) {
                const runs = await discoverRuns(github, context.repo, sha, workflow, observations);
                if (!runs.length) throw new Error(`Cannot discover ${workflow} main push for ${sha}`);
                core.info(`Discovered ${runs.length} exact main push run(s) of ${workflow} for ${sha}`);
              }
            } finally {
              require('node:fs').writeFileSync('ci-artifacts/release-discovery.json', JSON.stringify({ sha, observations }, null, 2));
            }
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-and-release-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
  build:
    needs: protocol-and-release-policy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - goos: linux
            arches: amd64 arm64 386 arm loong64
          - goos: windows
            arches: amd64 arm64 386
          - goos: darwin
            arches: amd64 arm64
          - goos: freebsd
            arches: amd64 arm64 386 arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - name: Run transport and runtime contract tests
        if: matrix.goos == 'linux'
        run: bash scripts/ci/run-go-tests.sh ./core/... ./clientcore ./server ./monitoring/unit ./terminal ./cmd
      - name: Build all architectures for this OS
        env:
          GOOS: ${{ matrix.goos }}
          TARGET_ARCHES: ${{ matrix.arches }}
          CGO_ENABLED: '0'
          VERSION: ${{ github.sha }}
        run: bash scripts/ci/build-targets.sh
      - name: Upload amd64 binaries
        if: contains(format(' {0} ', matrix.arches), ' amd64 ')
        uses: actions/upload-artifact@v7
        with:
          name: komari-agent-${{ matrix.goos }}-amd64
          path: build/${{ matrix.goos }}-amd64/
          if-no-files-found: error
      - name: Upload arm64 binaries
        if: contains(format(' {0} ', matrix.arches), ' arm64 ')
        uses: actions/upload-artifact@v7
        with:
          name: komari-agent-${{ matrix.goos }}-arm64
          path: build/${{ matrix.goos }}-arm64/
          if-no-files-found: error
      - name: Upload 386 binaries
        if: contains(format(' {0} ', matrix.arches), ' 386 ')
        uses: actions/upload-artifact@v7
        with:
          name: komari-agent-${{ matrix.goos }}-386
          path: build/${{ matrix.goos }}-386/
          if-no-files-found: error
      - name: Upload arm binaries
        if: contains(format(' {0} ', matrix.arches), ' arm ')
        uses: actions/upload-artifact@v7
        with:
          name: komari-agent-${{ matrix.goos }}-arm
          path: build/${{ matrix.goos }}-arm/
          if-no-files-found: error
      - name: Upload loong64 binaries
        if: contains(format(' {0} ', matrix.arches), ' loong64 ')
        uses: actions/upload-artifact@v7
        with:
          name: komari-agent-${{ matrix.goos }}-loong64
          path: build/${{ matrix.goos }}-loong64/
          if-no-files-found: error
      - name: Retain main-build-logs-${{ matrix.goos }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-build-logs-${{ matrix.goos }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
    name: Cross-compile / ${{ matrix.goos }}
    timeout-minutes: 90
  platform:
    needs: protocol-and-release-policy
    uses: ./.github/workflows/platform-checks.yml
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
